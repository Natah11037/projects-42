[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "pillow==12.3.0",
    "pygame==2.6.1",
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "flake8>=7.3.0",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "wheel>=0.43"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mazegen*"]
